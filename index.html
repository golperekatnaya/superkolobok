<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#FFFCF5">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="Суперколобок">
    <meta name="description" content="Интерактивная игра-мультфильм для детей о дружбе и работе в команде">
    
    <title>Суперколобок</title>
    
    <link rel="manifest" href="site.webmanifest">
    <link rel="apple-touch-icon" href="media/images/apple-touch-icon.png">
    <link rel="icon" type="image/svg+xml" href="media/images/favicon.svg">
    <link rel="icon" type="image/png" sizes="96x96" href="media/images/favicon-96x96.png">
    <link rel="shortcut icon" href="media/images/favicon.ico">
    
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <div class="app-container">
        
        <header class="game-header">
            <div class="header-left">
                <div class="progress-container hidden" id="progressContainer">
                    <div class="progress-line-filled" id="progressLineFilled"></div>
                    <div class="progress-line"></div>
                    <div class="progress-kolobok" id="progressKolobok">
                        <img src="" alt="Колобок" id="kolobokImg">
                    </div>
                </div>
            </div>
            
            <div class="level-badge" id="levelBadge">Суперколобок</div>
            
            <div class="header-right">
                <!-- Ключик в хедере -->
                <div id="headerKeysBadge" style="display:none;align-items:center;gap:4px;background:#FFF8EC;border:2px solid #F5B342;border-radius:50px;padding:2px 10px;font-size:0.75rem;font-weight:700;color:#C68B3C;">
                    <img src="media/images/key-icon.png" alt="" style="width:16px;height:16px;" onerror="this.outerHTML='<span style=font-size:14px;>🔑</span>'">
                    <span id="headerKeysCount">0</span>
                </div>
                
                <button class="header-icon-btn" id="profileBtn" title="Профиль" aria-label="Профиль">
                    <svg viewBox="0 0 32 32" fill="none">
                        <circle cx="16" cy="10" r="5" stroke="#B87A3A" stroke-width="2.5"/>
                        <path d="M6 28c0-5.5 4.5-10 10-10s10 4.5 10 10" stroke="#B87A3A" stroke-width="2.5" stroke-linecap="round"/>
                    </svg>
                </button>
                
                <button class="header-icon-btn" id="homeBtn" title="На главную" aria-label="На главную">
                    <svg viewBox="0 0 32 32" fill="none">
                        <path d="M4 16L16 4l12 12" stroke="#B87A3A" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
                        <path d="M8 14v12h16V14" stroke="#B87A3A" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
                    </svg>
                </button>
                
                <button class="header-icon-btn" id="backBtn" title="Назад" aria-label="Вернуться назад">
                    <svg viewBox="0 0 32 32" fill="none">
                        <path d="M20 8L12 16L20 24" stroke="#B87A3A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
                    </svg>
                </button>
                
                <button class="header-icon-btn" id="soundToggleBtn" title="Звук" aria-label="Включить/выключить звук">
                    <svg id="soundIcon" viewBox="0 0 32 32" fill="none">
                        <path d="M6 12V20H10L18 28V4L10 12H6Z" fill="#B87A3A"/>
                        <path d="M22 10C24 12 24 20 22 22" stroke="#B87A3A" stroke-width="2" stroke-linecap="round"/>
                        <path d="M26 6C30 10 30 22 26 26" stroke="#B87A3A" stroke-width="2" stroke-linecap="round"/>
                    </svg>
                </button>
                
                <button class="header-icon-btn" id="resetBtn" title="Пройти ещё раз" aria-label="Начать заново">
                    <svg viewBox="0 0 32 32" fill="none">
                        <path d="M6 16C6 10.5 10.5 6 16 6C20 6 23.5 8.5 25 12" stroke="#B87A3A" stroke-width="2.5" stroke-linecap="round"/>
                        <path d="M25 8V12H21" stroke="#B87A3A" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
                        <path d="M26 16C26 21.5 21.5 26 16 26C12 26 8.5 23.5 7 20" stroke="#B87A3A" stroke-width="2.5" stroke-linecap="round"/>
                        <path d="M7 24V20H11" stroke="#B87A3A" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
                    </svg>
                </button>
            </div>
        </header>
        
        <main class="scene-content" id="sceneContent">
            <div id="loadingScreen" style="display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100%;background:linear-gradient(180deg, #FFFCF5 0%, #FEF5E6 100%);position:relative;overflow:hidden;">
                <div class="loading-kolobok-container">
                    <div class="loading-ring">
                        <svg viewBox="0 0 100 100">
                            <circle cx="50" cy="50" r="42" fill="none" stroke="#F0E6D8" stroke-width="5"/>
                            <circle id="loadingCircle" cx="50" cy="50" r="42" fill="none" stroke="#F5B342" stroke-width="5" stroke-linecap="round" stroke-dasharray="264" stroke-dashoffset="264" transform="rotate(-90 50 50)"/>
                        </svg>
                    </div>
                    <div class="loading-kolobok">
                        <img src="media/images/kolobok-progress.png" alt="Колобок">
                    </div>
                </div>
                <p class="loading-text">Загружаем приключение...</p>
                <p class="loading-subtitle">Качусь и учусь</p>
            </div>
        </main>
        
    </div>
    
    <script src="js/config.js"></script>
    <script src="js/state.js"></script>
    <script src="js/progress.js"></script>
    <script src="js/audio.js"></script>
    <script src="js/ui/components.js"></script>
    <script src="js/ui/popup.js"></script>
    <script src="js/scenes/name-screen.js"></script>
    <script src="js/scenes/series-select.js"></script>
    <script src="js/scenes/video-scene.js"></script>
    <script src="js/scenes/hint-screen.js"></script>
    <script src="js/scenes/game1.js"></script>
    <script src="js/scenes/game2.js"></script>
    <script src="js/scenes/game3.js"></script>
    <script src="js/scenes/test.js"></script>
    <script src="js/scenes/finale.js"></script>
    <script src="js/navigation.js"></script>
    <script src="js/app.js"></script>
    <script src="js/pwa.js"></script>
    
    <script>
        (function() {
            var circle = document.getElementById('loadingCircle');
            if (circle) {
                var circumference = 2 * Math.PI * 42;
                circle.style.strokeDasharray = circumference;
                
                var progress = 0;
                var interval = setInterval(function() {
                    progress += Math.random() * 25;
                    if (progress >= 90) { progress = 90; clearInterval(interval); }
                    var offset = circumference - (progress / 100) * circumference;
                    circle.style.strokeDashoffset = offset;
                }, 300);
                
                var checkInterval = setInterval(function() {
                    if (typeof App !== 'undefined' && App.isInitialized()) {
                        clearInterval(checkInterval);
                        clearInterval(interval);
                        circle.style.strokeDashoffset = '0';
                        setTimeout(function() {
                            var ls = document.getElementById('loadingScreen');
                            if (ls) {
                                ls.style.opacity = '0';
                                ls.style.transition = 'opacity 0.4s ease';
                                setTimeout(function() { ls.remove(); }, 400);
                            }
                        }, 300);
                    }
                }, 100);
            }
            
            document.addEventListener('DOMContentLoaded', function() {
                var soundBtn = document.getElementById('soundToggleBtn');
                if (soundBtn) {
                    soundBtn.addEventListener('click', function() {
                        if (typeof AudioManager !== 'undefined') {
                            var isOn = AudioManager.toggleMute();
                            var icon = document.getElementById('soundIcon');
                            if (icon) icon.style.opacity = isOn ? '1' : '0.5';
                        }
                    });
                }
            });
        })();
    </script>
</body>
</html>
